name: Deploy site

# Builds nothing — this is a static site. It assembles the public files and
# publishes them to the gh-pages branch, which GitHub Pages serves.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Assemble site 📦
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp .nojekyll _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          [ -f robots.txt ] && cp robots.txt _site/ || true

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
